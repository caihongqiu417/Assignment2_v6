behaviors:
  RollingControl:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.20
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 50000
    max_steps: 200000
    time_horizon: 64
    summary_freq: 10000
    init_path: results/Team01_Hard_E7_SafetyLambda_Lambda020_seed2/RollingControl/RollingControl-200018.pt

checkpoint_settings:
  initialize_from: Team01_Hard_E7_SafetyLambda_Lambda020_seed2

env_settings:
  seed: 4

engine_settings:
  time_scale: 20.0

# Fixed E8 Center rewards for both PPO clipping arms.
environment_parameters:
  safety_feedback_lambda: 0.020
  net_push_reward_scale: 0.005
  net_push_min_progress: 0.25
